<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15191B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Albania">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Albania · field app</title>
<style>
:root{
  --bg:#15191B; --bg2:#1C2224; --bg3:#232C2E; --line:#303B3D;
  --ink:#E9E4D8; --ink2:#A9B1AB; --ink3:#7E8783;
  --teal:#56B8AD; --teal-bg:#16302E; --clay:#E27F52; --clay-bg:#3A241B;
  --gold:#DBAC4F; --gold-bg:#34301D; --stone:#9DB3B8; --stone-bg:#26312F;
  --violet:#B9A8E6; --violet-bg:#2A2540;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Charter,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;min-height:100%;overscroll-behavior-y:none}
a{color:var(--teal)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + var(--sat)) 16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top h1{margin:0;font:600 17px/1.2 var(--serif);letter-spacing:.01em}
.clock{font:12px var(--mono);color:var(--ink2)}
.clock b{color:var(--ink);font-weight:500}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.dchip{flex:none;width:44px;padding:6px 0 5px;border-radius:10px;border:1px solid transparent;text-align:center;color:var(--ink2)}
.dchip .d{display:block;font:600 15px/1.1 var(--serif);color:var(--ink)}
.dchip .w{display:block;font:10px/1.4 var(--mono);text-transform:lowercase}
.dchip.today{border-color:var(--teal)}
.dchip.sel{background:var(--bg3);color:var(--ink)}
.dchip.past{opacity:.5}
.dchip.sel.past{opacity:1}

main{flex:1;padding:16px 16px calc(84px + var(--sab));max-width:640px;width:100%;margin:0 auto}
.view{display:none}.view.on{display:block}

.eyebrow{font:12px/1.4 var(--mono);color:var(--ink2);margin:0 0 4px}
h2{margin:0 0 12px;font:600 26px/1.15 var(--serif);letter-spacing:-.01em}
h3{margin:0;font:600 16px/1.3 var(--serif)}
.wx{display:inline-flex;align-items:center;gap:7px;font:12px var(--mono);color:var(--ink2);margin:2px 0 14px}
.wx b{color:var(--ink);font-weight:500}
.times{font:12px var(--mono);color:var(--ink2);margin:-6px 0 14px}
.times b{color:var(--ink);font-weight:500}

.now{border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;background:var(--bg2);padding:14px 16px 12px;margin:0 0 16px}
.now.next{border-left-color:var(--gold)}
.now .lbl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px 14px;font:12px var(--mono);color:var(--ink2);margin-bottom:6px}
.now .lbl span:first-child{flex:none}
.now .lbl b{color:var(--ink);font-weight:500}
.now h3{font-size:20px;margin-bottom:4px}
.now p{margin:0 0 10px;color:var(--ink2);font-size:14px;line-height:1.45}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;line-height:1;background:var(--bg3);color:var(--ink);text-decoration:none;min-height:36px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#0F1C1A;font-weight:600}
.btn.small{padding:6px 9px;font-size:12.5px;min-height:30px}
.btn svg{width:14px;height:14px}

.bring{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.bring span{font-size:12.5px;padding:5px 9px;border-radius:100px;background:var(--gold-bg);color:var(--gold)}
.bring .t{width:100%;font:12px var(--mono);color:var(--ink2);padding:0;background:none;margin-bottom:2px}

.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line);position:relative}
.stop:first-child{border-top:0}
.stop .t{font:13px var(--mono);color:var(--ink2);padding-top:2px}
.stop.past{opacity:.5}
.stop.cur .t,.stop.cur h3{color:var(--teal)}
.stop.cur::before{content:"";position:absolute;left:-16px;top:12px;bottom:12px;width:3px;background:var(--teal);border-radius:0 2px 2px 0}
.stop h3{font-size:15px;margin-bottom:3px}
.stop p{margin:0 0 8px;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.stop.past p{display:none}

.card{border:1px solid var(--line);border-radius:12px;background:var(--bg2);padding:14px 16px;margin:0 0 12px}
.card.violet{border-left:4px solid var(--violet)}
.card .sub{font:12px var(--mono);color:var(--ink2);margin:2px 0 8px}
.card ul{margin:0 0 10px;padding-left:16px;font-size:13.5px;line-height:1.5;color:var(--ink2)}
.card li{margin-bottom:3px}
.dayrow{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.dayrow:first-child{border-top:0}
.dayrow .n{flex:none;width:44px;font:600 22px/1 var(--serif);color:var(--ink)}
.dayrow .n small{display:block;font:10px var(--mono);color:var(--ink2);margin-top:2px;text-transform:lowercase}
.dayrow .b{flex:1}
.dayrow .b h3{font-size:15px}
.dayrow .b span{display:block;font:12px var(--mono);color:var(--ink2);margin-top:3px}
.tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.tag.city{background:var(--gold)}.tag.mountain{background:var(--stone)}.tag.canyon{background:var(--clay)}.tag.coast{background:var(--teal)}

.pack label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.pack label:first-child{border-top:0}
.pack input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--teal)}
.pack .done{color:var(--ink3);text-decoration:line-through}
.pack h3{margin:18px 0 4px;color:var(--ink2);font:12px var(--mono)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs button{flex:1;padding:10px 0 9px;font:12px var(--mono);color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:4px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button.on{color:var(--teal)}

.sheet{position:fixed;inset:0;z-index:20;display:none}
.sheet.on{display:block}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;background:var(--bg2);border-radius:16px 16px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .hd h3{font-size:17px}
.sheet .hd .sub{font:12px var(--mono);color:var(--ink2);margin-top:3px}
.sheet .body{overflow:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.sheet ul{margin:0 0 12px;padding-left:16px;font-size:14px;line-height:1.5}
.sheet li{margin-bottom:4px}
.sheet pre{white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 var(--mono);color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0 0}
.sheet .meta{font:11.5px var(--mono);color:var(--ink3);margin:12px 0 4px}
.banner{background:var(--teal-bg);color:var(--teal);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.banner.violet{background:var(--violet-bg);color:var(--violet)}
.foot{font:11px var(--mono);color:var(--ink3);text-align:center;margin:28px 0 0}
@media (prefers-reduced-motion:no-preference){.sheet.on .panel{animation:up .18s ease-out}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Albania, on the day</h1><div class="clock" id="clock"></div></div>
  <div class="strip" id="strip"></div>
</header>
<main>
  <section class="view" id="v-now"></section>
  <section class="view" id="v-over"></section>
  <section class="view" id="v-book"></section>
  <section class="view" id="v-pack"></section>
</main>
<nav class="tabs">
  <button data-v="now"><span class="ico" data-ico="now"></span>Now</button>
  <button data-v="over"><span class="ico" data-ico="list"></span>Trip</button>
  <button data-v="book"><span class="ico" data-ico="book"></span>Bookings</button>
  <button data-v="pack"><span class="ico" data-ico="pack"></span>Pack</button>
</nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="bg" id="sh-bg"></div>
  <div class="panel">
    <div class="hd"><div><h3 id="sh-title"></h3><div class="sub" id="sh-sub"></div></div><button class="btn small" id="sh-close">Close</button></div>
    <div class="body" id="sh-body"></div>
  </div>
</div>
<script>

const D = {"days": [{"date": "2026-09-25", "title": "Land in Tirana", "tag": "city", "wake": "09:00", "road": "10:00", "wx": ["🌧", "67° / 55°F", "rain 75%"], "bring": ["docs", "city"], "stops": [["00:30", "Land at TIA, taxi to 7even Boutique Hostel", "~25 min to the centre. Confirm the late arrival — you're past their midnight cutoff.", "41.4147,19.7206", "7even"], ["10:00", "Get lek at a kambio", "Do this first — Theth, Valbonë and Kakome are cash-only later.", "Skanderbeg Square, Tirana", null], ["11:00", "Skanderbeg Square & Et'hem Bey Mosque", "Walking orientation. Everything today is on foot.", "Skanderbeg Square, Tirana", null], ["13:30", "Bunk'Art 2", "Cold War bunker museum, 09:30–18:30. The indoor stop on a wet day.", "Bunk'Art 2, Tirana", null], ["15:30", "Pyramid of Tirana", "Climb it for the city view.", "Pyramid of Tirana", null], ["19:30", "Dinner in Blloku", "The bar district. First night; stay close.", "Blloku, Tirana", null]]}, {"date": "2026-09-26", "title": "Car, Kruja, Shkodër", "tag": "city", "wake": "07:00", "road": "07:40", "wx": ["🌤", "78° / 57°F", "rain 10%"], "bring": ["car", "docs"], "stops": [["07:40", "Check out, walk to Avis", "Bags with you — you're not coming back.", "Rruga Themistokli Gërmenji 10, Tirana", "7even"], ["08:00", "Pick up the rental car", "Avis 24894486US1 under Taksh. Assumes zero desk time — everything slides if it runs long.", "Rruga Themistokli Gërmenji 10, Tirana", "avis"], ["08:45", "Kruja Castle & Old Bazaar", "Two hours. Museums open ~09:00; start with the bazaar and the walls.", "41.5086,19.7929", null], ["10:45", "Drive to Shkodër, drop bags", "~1h 30m. Reception opens 06:00: book the cruise, parking 27–29, the 14:00 Theth bus, poles.", "Shkodra Hostel & Day Tours, Rruga Gjylbegaj, Shkodër", "shkodra"], ["12:45", "Lunch on Rruga Kolë Idromeno", "Outfitters on this street rent poles if the hostel doesn't.", "Rruga Kolë Idromeno, Shkodër", null], ["14:15", "Mesi Bridge", "Ottoman bridge over the Kir, 1770. Half an hour.", "42.1258,19.5533", null], ["15:15", "Rozafa Castle", "One hour. Back at the hostel by 16:45 to check in and shower.", "42.0466,19.4941", null], ["18:30", "Sunset cruise, Lake Shkodra", "6:30–11 PM, €40 pp as guests. Leaves from the hostel.", "Shkodra Hostel & Day Tours, Rruga Gjylbegaj, Shkodër", "shkodra"]]}, {"date": "2026-09-27", "title": "Bus to Theth", "tag": "mountain", "wake": "08:00", "road": "09:00", "wx": ["☀️", "64° / 46°F", "rain 0%"], "bring": ["hike", "docs"], "stops": [["09:00", "Marubi National Museum of Photography", "One hour. Check out by 10:00 — bags to storage, car stays in the hostel lot.", "Marubi National Museum of Photography, Shkodër", "shkodra"], ["10:30", "Poles + snacks errand", "Rruga Kolë Idromeno if not done yesterday. Cash for the mountains.", "Rruga Kolë Idromeno, Shkodër", null], ["14:00", "Bus Shkodër → Theth", "~2h through the Qafa e Thorës pass. Confirm the operator with the hostel.", "Shkodra Hostel & Day Tours, Rruga Gjylbegaj, Shkodër", null], ["16:00", "Arrive Theth, walk to Gjelaj", "150 m path up from the road — ask the driver where to drop you.", "Guest House Gjelaj, Theth", "gjelaj"], ["16:45", "Blue Eye of Theth or the Grunas waterfall", "Short walk before dark. Dinner at the guesthouse; ask for early breakfast.", "Grunas Waterfall, Theth", null]]}, {"date": "2026-09-28", "title": "Valbona Pass on foot", "tag": "mountain", "wake": "06:00", "road": "07:00", "wx": ["🌤", "60° / 42°F", "rain 20%"], "bring": ["hike"], "stops": [["07:00", "Start walking from Gjelaj", "17 km, ~1,000 m up and down, 6–8 h. Turn back if storms are forecast.", "Guest House Gjelaj, Theth", "gjelaj"], ["10:30", "Valbona Pass, ~1,800 m", "Cold and exposed. Fleece on at the top, then the long descent.", "Valbona Pass, Albania", null], ["15:30", "Arrive Valbonë, Guest house 2", "Check in, wash, eat. Sort tonight: packed breakfast and the 05:00 Fierzë transfer.", "Guest house 2, Rruga Azem Hajdari, Valbonë", "valbona"]]}, {"date": "2026-09-29", "title": "Komani Lake, south to the vineyards", "tag": "mountain", "wake": "04:00", "road": "05:00", "wx": ["🌤", "77° / 55°F", "rain 20%"], "bring": ["early", "car", "wine"], "stops": [["05:00", "Transfer Valbonë → Fierzë dock", "No bus this early — guesthouse or a Berisha taxi (~€50). Book it the night before.", "Fierzë ferry terminal, Albania", "valbona"], ["06:00", "Boat Dragobia, Fierzë → Koman", "Foot passengers. €8.80 online. 2h30–3h on the water.", "Fierzë ferry terminal, Albania", null], ["09:30", "Bus Koman → Shkodër", "Northern Escape €10, arrives ~11:30.", "Koman ferry terminal, Albania", null], ["11:45", "Reclaim the car, drive south", "Google says 2h37 to Berat; budget 3h15–3h30 with fuel and Tirana traffic.", "Shkodra Hostel & Day Tours, Rruga Gjylbegaj, Shkodër", "shkodra"], ["15:15", "Check in at Nurellari Winery", "Both names, one property. Rest before the tasting.", "Nurellari Winery, Fushë Peshtan, Berat", "nurellari"], ["17:00", "Full wine tasting", "Two hours, seven wines. You sleep upstairs.", "Nurellari Winery, Fushë Peshtan, Berat", "tasting"]]}, {"date": "2026-09-30", "title": "Berat, then on to Përmet", "tag": "city", "wake": "09:30", "road": "11:00", "wx": ["🌤", "77° / 55°F", "rain 20%"], "bring": ["city", "docs"], "stops": [["11:20", "Arrive Berat, park by the river", "Bulevardi Republika near the Gorica footbridge. On foot from here.", "40.7042,19.9480", null], ["12:00", "Lunch — Homemade Food Lili", "Book a day ahead or accept a wait. Fallbacks: Antigoni, Mangalemi.", "Homemade Food Lili, Berat", null], ["13:15", "Mangalem, Gorica & the castle", "Three hours. Onufri Museum inside the castle.", "Berat Castle", null], ["16:15", "Drive to Përmet via Këlcyrë Gorge", "~3h. Dusk in the gorge. Message The Stone House with your ~19:15 arrival.", "The Stone House, Rruga Mulliri i Vjetër 19, Përmet", "stonehouse"], ["20:00", "Dinner in Përmet", "Trifilia, Te Culi, Sofra Përmetare. Gliko and raki after.", "Përmet, Albania", null]]}, {"date": "20   const c = small?' small':'';
  let h = `<a class="btn primary${c}" target="_blank" rel="noopener" href="${navUrl(s.nav)}">${ICON.nav}Navigate</a>`;
  if(IOS) h += `<a class="btn${c}" target="_blank" rel="noopener" href="${appleUrl(s.nav)}">Apple Maps</a>`;
  if(s.bk && D.bookings[s.bk]){ const b=D.bookings[s.bk]; h += `<button class="btn${c}" data-bk="${s.bk}">${ICON.mail}Confirmation</button>`; if(b.tel) h+=`<a class="btn${c}" href="tel:${b.tel}">${ICON.tel}Call</a>`; }
  return h;
}

function renderNow(){
  const i=currentDay(), d=D.days[i], now=tiranaNow(), isToday=(d.date===now.date);
  const stops = d.stops.map(([time,name,note,nav,bk])=>({time,name,note,nav,bk}));
  let cur=-1; if(isToday){ stops.forEach((s,k)=>{ if(mins(s.time)<=now.mins) cur=k; }); }
  const nxt = isToday ? (cur+1<stops.length?cur+1:-1) : 0;
  let head='';
  if(!isToday){
    const before = now.date < D.days[0].date;
    head = `<div class="banner">${before ? 'Trip starts '+fmtDate(D.days[0].date)+'. Showing day 1.' : (state.manual?'Viewing '+fmtDate(d.date)+'. <button style="text-decoration:underline" id="back-today">Back to today</button>':'')}</div>`;
  }
  let nowCard='';
  if(isToday){
    if(cur>=0){ const s=stops[cur]; const n=stops[nxt];
      nowCard = `<div class="now"><div class="lbl"><span>Now · started ${rel(now.mins-mins(s.time))} ago</span>${n?`<span>Next: <b>${esc(n.name)}</b> in ${rel(mins(n.time)-now.mins)}</span>`:'<span>Last stop of the day</span>'}</div><h3>${esc(s.name)}</h3><p>${esc(s.note)}</p><div class="actions">${stopActions(s)}</div></div>`;
      if(n) nowCard += `<div class="now next"><div class="lbl"><span>Up next · ${n.time}</span><span>in <b>${rel(mins(n.time)-now.mins)}</b></span></div><h3>${esc(n.name)}</h3><p>${esc(n.note)}</p><div class="actions">${stopActions(n,true)}</div></div>`;
    } else { const n=stops[0];
      nowCard = `<div class="now next"><div class="lbl"><span>First stop · ${n.time}</span><span>in <b>${rel(mins(n.time)-now.mins)}</b></span></div><h3>${esc(n.name)}</h3><p>${esc(n.note)}</p><div class="actions">${stopActions(n)}</div></div>`;
    }
  }
  const bring = [...new Set(d.bring.flatMap(k=>D.bring[k]||[]))];
  $('#v-now').innerHTML = `${head}
    <p class="eyebrow">Day ${i+1} · ${fmtDate(d.date)}</p>
    <h2>${esc(d.title)}</h2>
    <div class="wx"><span>${d.wx[0]}</span><b>${d.wx[1]}</b><span>${d.wx[2]}</span></div>
    <p class="times">Wake <b>${d.wake}</b> · On the road <b>${d.road}</b></p>
    ${nowCard}
    <div class="bring"><span class="t">Bring today</span>${bring.map(b=>`<span>${esc(b)}</span>`).join('')}</div>
    <ul class="stops">${stops.map((s,k)=>`<li class="stop${isToday&&k<cur?' past':''}${isToday&&k===cur?' cur':''}"><div class="t">${s.time}</div><div><h3>${esc(s.name)}</h3><p>${esc(s.note)}</p><div class="actions">${stopActions(s,true)}</div></div></li>`).join('')}</ul>
    <p class="foot">Times are Europe/Tirane · built ${D.built}</p>`;
  const bt=$('#back-today'); if(bt) bt.onclick=()=>{ state.manual=false; render(); };
}

function renderOverview(){
  const ti=todayIndex();
  $('#v-over').innerHTML = `<h2>The trip</h2>` + D.days.map((d,i)=>`<button class="dayrow" data-i="${i}"><div class="n">${+d.date.slice(8)}<small>${dow(d.date)}</small></div><div class="b"><h3><i class="tag ${d.tag}"></i>${esc(d.title)}${i===ti?' — today':''}</h3><span>${d.wx[0]} ${d.wx[1]} · ${d.stops.length} stops · ${d.stops[0][0]} → ${d.stops[d.stops.length-1][0]}</span></div></button>`).join('');
  $('#v-over').querySelectorAll('.dayrow').forEach(b=>b.onclick=()=>{ state.manual=true; state.day=+b.dataset.i; setView('now'); });
}

function renderBookings(){
  const order=['flights','7even','avis','shkodra','gjelaj','valbona','nurellari','tasting','stonehouse','rafting','hangout','flamingo','grama','balkan'];
  $('#v-book').innerHTML = `<h2>Bookings</h2>` + order.map(k=>{ const b=D.bookings[k]; return `<div class="card${k==='grama'?' violet':''}"><h3>${esc(b.title)}</h3><div class="sub">${esc(b.sub)}</div><ul>${b.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><div class="actions">${b.email?`<button class="btn small" data-bk="${k}">${ICON.mail}Open email</button>`:''}${b.tel?`<a class="btn small" href="tel:${b.tel}">${ICON.tel}Call</a>`:''}${b.mail?`<a class="btn small" href="mailto:${b.mail}">Email</a>`:''}</div></div>`; }).join('');
}

function renderPack(){
  const groups = {docs:'Documents & money',car:'The car',hike:'The pass',canyon:'The Vjosa',beach:'Beach days',boat:'The boat',wine:'The winery',early:'The 05:00 start',city:'Towns',fly:'Flying home'};
  let saved={}; try{ saved=JSON.parse(localStorage.getItem('alb-app-pack')||'{}'); }catch(e){}
  $('#v-pack').innerHTML = `<h2>Packing</h2><div class="pack">` + Object.entries(groups).map(([k,t])=>`<h3>${t}</h3>`+(D.bring[k]||[]).map(item=>{ const id=k+'|'+item; const on=!!saved[id]; return `<label><input type="checkbox" data-id="${esc(id)}"${on?' checked':''}><span class="${on?'done':''}">${esc(item)}</span></label>`; }).join('')).join('') + `</div>`;
  $('#v-pack').querySelectorAll('input').forEach(c=>c.onchange=()=>{ saved[c.dataset.id]=c.checked; c.nextElementSibling.className=c.checked?'done':''; try{ localStorage.setItem('alb-app-pack',JSON.stringify(saved)); }catch(e){} });
}

function openSheet(k){
  const b=D.bookings[k]; if(!b) return;
  $('#sh-title').textContent=b.title; $('#sh-sub').textContent=b.sub;
  let h = `<ul>${b.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul><div class="actions">${b.tel?`<a class="btn small" href="tel:${b.tel}">${ICON.tel}Call</a>`:''}${b.mail?`<a class="btn small" href="mailto:${b.mail}">Email them</a>`:''}</div>`;
  if(b.email) h += `<div class="meta">${esc(b.email.subject)}<br>${esc(b.email.from)} · ${esc(b.email.date)}</div><pre>${esc(b.email.text)}</pre>`;
  $('#sh-body').innerHTML=h; $('#sheet').classList.add('on'); $('#sh-body').scrollTop=0;
}
function closeSheet(){ $('#sheet').classList.remove('on'); }

function setView(v){ state.view=v; try{ localStorage.setItem('alb-view',v); }catch(e){} render(); window.scrollTo(0,0); }
function render(){
  renderStrip();
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on', x.id==='v-'+state.view));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===state.view));
  if(state.view==='now') renderNow(); else if(state.view==='over') renderOverview(); else if(state.view==='book') renderBookings(); else renderPack();
  const t=tiranaNow(); $('#clock').innerHTML=`Tirana <b>${t.hm}</b>`;
}
document.addEventListener('click',e=>{ const b=e.target.closest('[data-bk]'); if(b){ openSheet(b.dataset.bk); } });
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('#sh-close').onclick=closeSheet; $('#sh-bg').onclick=closeSheet;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
document.querySelectorAll('.ico').forEach(s=>s.outerHTML=ICON[s.dataset.ico]);
render();
setInterval(()=>{ if(state.view==='now') render(); else { const t=tiranaNow(); $('#clock').innerHTML=`Tirana <b>${t.hm}</b>`; } }, 30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) render(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }

</script>
</body>
</html>
